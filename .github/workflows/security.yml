name: Security and supply-chain checks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 20 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Audit all dependencies
        run: npm run security:audit
      - name: Verify registry signatures
        if: always()
        run: npm run security:signatures
      - run: npm test
      - run: npm run test:deployment
      - run: npm run test:backend
      - name: Build pinned ClamAV scanner image
        run: docker build --platform linux/amd64 --tag studio-7321-clamav:ci scanner
      - name: Scan ClamAV container for fixed high and critical CVEs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: studio-7321-clamav:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          format: table
      - name: Bundle production Workers without publishing
        run: |
          npx wrangler deploy --dry-run --config wrangler.frontend.production.jsonc
          npx wrangler deploy --dry-run --config wrangler.api.production.jsonc
          npx wrangler deploy --dry-run --config wrangler.scan.production.jsonc
      - run: npm run test:sites
