name: Security and supply-chain checks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 20 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Audit all dependencies
        run: npm run security:audit
      - name: Verify registry signatures
        if: always()
        run: npm run security:signatures
      - run: npm test
      - run: npm run test:deployment
      - name: Bundle production Workers without publishing
        run: |
          npx wrangler deploy --dry-run --config wrangler.frontend.production.jsonc
          npx wrangler deploy --dry-run --config wrangler.api.production.jsonc
      - run: npm run test:backend
      - run: npm run test:sites
